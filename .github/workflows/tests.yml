name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [web]

env:
  EMSDK_VERSION: "6.0.9"
  WASMTIME_VERSION: "48.0.0"

jobs:
  scalar-wasmtime:
    name: Portable scalar Wasmtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EMSDK: ${{ github.workspace }}/.emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Wasmtime 48 LTS
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: ${{ env.WASMTIME_VERSION }}

      - name: Setup Emscripten SDK (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "${EMSDK}"
          "${EMSDK}/emsdk" install "${EMSDK_VERSION}"
          "${EMSDK}/emsdk" activate "${EMSDK_VERSION}"
          echo "EM_CONFIG=${EMSDK}/.emscripten" >> "${GITHUB_ENV}"
          echo "${EMSDK}" >> "${GITHUB_PATH}"
          echo "${EMSDK}/upstream/emscripten" >> "${GITHUB_PATH}"
          echo "${EMSDK}/upstream/bin" >> "${GITHUB_PATH}"

      - name: Setup Emscripten SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/emscripten-core/emsdk.git $env:EMSDK
          & "$env:EMSDK\emsdk.bat" install $env:EMSDK_VERSION
          & "$env:EMSDK\emsdk.bat" activate $env:EMSDK_VERSION
          "EM_CONFIG=$env:EMSDK\.emscripten" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EMXX=em++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:EMSDK | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:EMSDK\upstream\emscripten" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:EMSDK\upstream\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show portable toolchain
        shell: bash
        run: |
          python --version
          wasmtime --version
          if [ "${RUNNER_OS}" = "Windows" ]; then
            em++.exe --version | head -n 2
          else
            em++ --version | head -n 2
          fi

      - name: Build and run all scalar Wasmtime families
        run: python tests/differential/run_all.py
