name: Differential Tests

on:
  workflow_dispatch:
  push:
    branches:
      - web
      - 'dev/*'

env:
  EMSDK_VERSION: "4.0.23"
  FRIDA_VERSION: "16.4.10"
  APKTOOL_VERSION: "3.0.1"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_PLATFORM_VERSION: "34"
  ANDROID_CMDLINE_TOOLS_VERSION: "11076708"
  LEGACY_NDK_BASENAME: "android-ndk-r17c"
  LEGACY_NDK_SHA1: "12cacc70c3fd2f40574015631c00f41fb8a39048"
  # Google Drive references are mutable; pin the exact oracle inputs each job consumes.
  # The APK hash also pins its embedded lib/arm64-v8a/libgame.so.
  REFERENCE_APK_SHA256: "7df08d36726e8640cf1f78b0154d19f8a24ccb090be97b9ec7b9de2e55acba5a"
  REFERENCE_LIBGAME_SHA256: "05e2ff4c77f1561608ad7703153d2fb09855bf223237a85dc2267fff1388564f"
  ORACLE_APK_PACKAGE: "org.tvp.kirikiri2_free_10309"
  REFERENCE_YUZULOGO_15HZ_XP3_SHA256: "038bab92728c80e917ed55224aa8c96cc04474d112d8a0e42730d908acd7e3df"
  REFERENCE_M2LOGO_15HZ_XP3_SHA256: "704729939ceabc2d93388cdc8b980bfd79506bedf660d0911c3dd13e9f78cb94"

jobs:
  # ── Record the Wasmtime side of the fresh motion_playback comparison.
  wasmtime:
    runs-on: macos-latest
    env:
      EMSDK: ${{ github.workspace }}/.emsdk
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      KRKR2_WASMTIME_GL_PLATFORM: "null"
      KRKR2_WASMTIME_GL_CONTEXT_API: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init public submodules
        run: git submodule update --init --recursive

      - name: Download reference files from Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set -euo pipefail
          for name in RCLONE_CONFIG_GDRIVE_CLIENT_ID RCLONE_CONFIG_GDRIVE_CLIENT_SECRET RCLONE_CONFIG_GDRIVE_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: GDRIVE_${name#RCLONE_CONFIG_GDRIVE_}"
              exit 1
            fi
          done
          brew install rclone
          mkdir -p reference/xp3
          for case in yuzulogo m2logo; do
            rclone copyto \
              "gdrive:reference/xp3/logo_test_oracle_${case}_15hz.xp3" \
              "reference/xp3/logo_test_oracle_${case}_15hz.xp3" \
              --checksum \
              --drive-acknowledge-abuse
          done
          {
            printf '%s  %s\n' \
              "${REFERENCE_YUZULOGO_15HZ_XP3_SHA256}" \
              "reference/xp3/logo_test_oracle_yuzulogo_15hz.xp3"
            printf '%s  %s\n' \
              "${REFERENCE_M2LOGO_15HZ_XP3_SHA256}" \
              "reference/xp3/logo_test_oracle_m2logo_15hz.xp3"
          } | shasum -a 256 -c -

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-ports-v1

      - name: Setup Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK }}
          ${{ env.EMSDK }}/emsdk install ${{ env.EMSDK_VERSION }}
          ${{ env.EMSDK }}/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          source ${{ env.EMSDK }}/emsdk_env.sh
          echo "EMSDK=${{ env.EMSDK }}" >> $GITHUB_ENV
          echo "EM_CONFIG=${{ env.EMSDK }}/.emscripten" >> $GITHUB_ENV
          echo "${{ env.EMSDK }}" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/emscripten" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/bin" >> $GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Wasmtime guest-trace dependencies
        run: |
          brew update
          brew install autoconf automake bison cmake glfw libtool ninja pkg-config wabt zstd
          osmesa_root="${RUNNER_TEMP}/osmesa"
          osmesa_pkg="${RUNNER_TEMP}/mesalib-24.3.4-h5c1a3a9_1.conda"
          curl -fsSL -o "${osmesa_pkg}" \
            "https://conda.anaconda.org/conda-forge/osx-arm64/mesalib-24.3.4-h5c1a3a9_1.conda"
          echo "6b141d5241d97f658834af7148c8c68701b9bdd5a2ffdae07ccffece4990282e  ${osmesa_pkg}" \
            | shasum -a 256 -c -
          mkdir -p "${osmesa_root}"
          unzip -p "${osmesa_pkg}" pkg-mesalib-24.3.4-h5c1a3a9_1.tar.zst \
            > "${osmesa_root}/pkg.tar.zst"
          tar --use-compress-program=unzstd -xf "${osmesa_root}/pkg.tar.zst" \
            -C "${osmesa_root}"
          test -f "${osmesa_root}/lib/libOSMesa.dylib"
          echo "KRKR2_WASMTIME_OSMESA_LIBRARY=${osmesa_root}/lib/libOSMesa.dylib" >> "${GITHUB_ENV}"
          echo "DYLD_LIBRARY_PATH=${osmesa_root}/lib:$(brew --prefix zstd)/lib:${DYLD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          python3 -m pip install -r tests/differential/python/requirements-wasm.txt

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}

      - name: Setup vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Ensure vcpkg is bootstrapped
        run: |
          test -x "${VCPKG_ROOT}/vcpkg" || "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          echo "${VCPKG_ROOT}" >> $GITHUB_PATH

      - name: Check NuGet API key
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "HAS_NUGET_KEY=true" >> $GITHUB_ENV
          fi

      - name: Add NuGet sources
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            brew install mono
          fi
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.NUGET_API_KEY }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.NUGET_API_KEY }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}

      - name: Prewarm Emscripten ports for Wasmtime full guest
        run: |
          source "${EMSDK}/emsdk_env.sh"
          # SDL2_ttf's port build invokes emcc with USE_FREETYPE/USE_HARFBUZZ.
          # Build those dependencies first so the nested port build does not
          # try to reacquire Emscripten's cache lock in CI.
          embuilder.py build freetype
          embuilder.py build harfbuzz harfbuzz-mt
          embuilder.py build sdl2 sdl2-mt
          embuilder.py build sdl2_ttf sdl2_ttf-mt

      - name: Verify motion_playback timing and sampling boundaries
        run: |
          python3 tests/differential/python/test_motion_timing.py
          python3 tests/differential/python/test_motion_playback_strict_oracle.py
          python3 tests/differential/python/test_motion_render_semantic.py
          node tests/differential/oracle_runner/test_motion_capture_hooks.js

      - name: Build Wasmtime full guest for motion_playback
        run: |
          source "${EMSDK}/emsdk_env.sh"
          export BISON_EXECUTABLE="$(brew --prefix bison)/bin/bison"
          cmake --preset "Wasmtime Headless Debug Config" \
            -DBISON_EXECUTABLE="${BISON_EXECUTABLE}"
          cmake --build out/wasmtime/debug --target krkr2_wasmtime_guest

      - name: Run motion_playback Wasmtime guest trace
        run: |
          source "${EMSDK}/emsdk_env.sh"
          rm -rf tests/differential/artifacts/motion_playback_wasmtime_traces
          rm -rf tests/differential/artifacts/motion_playback_render_stages_wasmtime
          mkdir -p tests/differential/artifacts/motion_playback_wasmtime_traces
          mkdir -p tests/differential/artifacts/motion_playback_render_stages_wasmtime
          for case in yuzulogo m2logo; do
            xp3="reference/xp3/logo_test_oracle_${case}_15hz.xp3"
            python3 tests/differential/python/run_motion_playback_wasmtime.py \
              --wasm out/wasmtime/debug/krkr2_wasmtime_guest.wasm \
              --startup-xp3 "${xp3}" \
              --case "${case}" \
              --skip-golden-diff \
              --write-port-traces tests/differential/artifacts/motion_playback_wasmtime_traces \
              --record-render-stages \
              --render-artifact-dir tests/differential/artifacts/motion_playback_render_stages_wasmtime
          done
          python3 tests/differential/python/validate_motion_render_artifact.py \
            --artifact-root tests/differential/artifacts/motion_playback_render_stages_wasmtime

      - name: Upload motion_playback Wasmtime traces
        uses: actions/upload-artifact@v4
        with:
          name: motion_playback-wasmtime-traces
          path: tests/differential/artifacts/motion_playback_wasmtime_traces/*.port.json
          if-no-files-found: error

      - name: Upload motion_playback Wasmtime render-stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motion_playback-wasmtime-render-stages
          path: |
            tests/differential/artifacts/motion_playback_render_stages_wasmtime/manifest.json
            tests/differential/artifacts/motion_playback_render_stages_wasmtime/events/**
          if-no-files-found: error

  # ── Build the legacy gnustl harness on a native x86_64 Linux host.
  #    Android NDK r17c only ships linux-x86_64 host tools, while the
  #    Redroid oracle job needs an arm64 runner. Keep those concerns split:
  #    produce arm64-v8a/libharness.so here, then pass it to adb-frida as
  #    an artifact.
  build-legacy-harness:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init public submodules
        run: git submodule update --init --recursive

      - name: Download reference files from Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set -euo pipefail
          for name in RCLONE_CONFIG_GDRIVE_CLIENT_ID RCLONE_CONFIG_GDRIVE_CLIENT_SECRET RCLONE_CONFIG_GDRIVE_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: GDRIVE_${name#RCLONE_CONFIG_GDRIVE_}"
              exit 1
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone unzip
          mkdir -p reference/packages reference/libgame
          rclone copyto \
            "gdrive:reference/packages/Kirikiroid2_1.3.9.apk" \
            "reference/packages/Kirikiroid2_1.3.9.apk" \
            --checksum \
            --drive-acknowledge-abuse
          printf '%s  %s\n' \
            "${REFERENCE_APK_SHA256}" \
            "reference/packages/Kirikiroid2_1.3.9.apk" \
            | sha256sum -c -
          unzip -p \
            "reference/packages/Kirikiroid2_1.3.9.apk" \
            "lib/arm64-v8a/libgame.so" \
            > reference/libgame/libgame.so
          printf '%s  %s\n' \
            "${REFERENCE_LIBGAME_SHA256}" \
            "reference/libgame/libgame.so" \
            | sha256sum -c -

      - name: Install harness build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl make python3 unzip file

      - name: Cache libharness.so build
        uses: actions/cache@v4
        id: libharness-cache
        with:
          path: tests/differential/oracle_runner/harness/prebuilt/libharness.so
          # Invalidate whenever the sources or build invocation change.
          key: libharness-gnustl-v2-${{ hashFiles('tests/differential/oracle_runner/harness/harness.cpp', 'tests/differential/oracle_runner/harness/jni_bridge.cpp', 'tests/differential/oracle_runner/harness/Android.mk', 'tests/differential/oracle_runner/harness/Application.mk', 'tests/differential/oracle_runner/harness/CMakeLists.txt', 'tests/differential/oracle_runner/harness/build_legacy.sh', 'tests/differential/oracle_runner/check_harness_abi.py') }}

      - name: Cache legacy Android NDK
        if: steps.libharness-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: legacy-ndk-cache
        with:
          path: ${{ runner.temp }}/${{ env.LEGACY_NDK_BASENAME }}
          # r17c is the last practical NDK line with GNU libstdc++/gnustl.
          # libharness.so must use this ABI family to match libgame.so.
          key: ${{ env.LEGACY_NDK_BASENAME }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install legacy Android NDK (build libharness only)
        if: steps.libharness-cache.outputs.cache-hit != 'true' && steps.legacy-ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/${LEGACY_NDK_BASENAME}-linux-x86_64.zip"
          echo "${LEGACY_NDK_SHA1}  /tmp/ndk.zip" | sha1sum -c -
          unzip -q /tmp/ndk.zip -d "${{ runner.temp }}"

      - name: Build libharness.so (legacy GNU C++ ABI)
        if: steps.libharness-cache.outputs.cache-hit != 'true'
        env:
          KRKR2_LEGACY_NDK: ${{ runner.temp }}/${{ env.LEGACY_NDK_BASENAME }}
        run: |
          set -eux
          tests/differential/oracle_runner/harness/build_legacy.sh

      - name: Check libharness.so C++ ABI
        run: |
          file tests/differential/oracle_runner/harness/prebuilt/libharness.so
          python3 tests/differential/oracle_runner/check_harness_abi.py \
            --harness tests/differential/oracle_runner/harness/prebuilt/libharness.so \
            --target-library reference/libgame/libgame.so

      - name: Upload libharness.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libharness-gnustl-arm64
          path: tests/differential/oracle_runner/harness/prebuilt/libharness.so
          if-no-files-found: error

  # ── Kirikiroid2 1.3.9 libgame oracle via ADB harness + Frida trace diff.
  #    Runs against a Redroid (Android-in-Docker) arm64 container on a
  #    native arm64 Linux host, which sidesteps the nested-virt limits
  #    of GitHub's macos-14 (HVF blocked) and KVM-less ubuntu-24.04-arm.
  #    Same kernel means no hardware virtualisation required; Android
  #    runs as a privileged container sharing the host kernel's binder.
  adb-frida:
    needs: [build-legacy-harness]
    runs-on: ubuntu-24.04-arm
    env:
      # Android 12 = API 31. _64only variant drops the 32-bit system
      # libraries; our harness APK + libgame.so are arm64-v8a only,
      # so 32-bit would just be dead weight. A12 image observed
      # stable in CI when A10 240527 was flaky.
      REDROID_IMAGE: redroid/redroid:12.0.0_64only-240527
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init public submodules
        run: git submodule update --init --recursive

      - name: Download reference files from Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set -euo pipefail
          for name in RCLONE_CONFIG_GDRIVE_CLIENT_ID RCLONE_CONFIG_GDRIVE_CLIENT_SECRET RCLONE_CONFIG_GDRIVE_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: GDRIVE_${name#RCLONE_CONFIG_GDRIVE_}"
              exit 1
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone unzip
          mkdir -p reference/libgame reference/packages reference/xp3
          rclone copyto \
            "gdrive:reference/packages/Kirikiroid2_1.3.9.apk" \
            "reference/packages/Kirikiroid2_1.3.9.apk" \
            --checksum \
            --drive-acknowledge-abuse
          for case in yuzulogo m2logo; do
            rclone copyto \
              "gdrive:reference/xp3/logo_test_oracle_${case}_15hz.xp3" \
              "reference/xp3/logo_test_oracle_${case}_15hz.xp3" \
              --checksum \
              --drive-acknowledge-abuse
          done
          {
            printf '%s  %s\n' \
              "${REFERENCE_APK_SHA256}" \
              "reference/packages/Kirikiroid2_1.3.9.apk"
            printf '%s  %s\n' \
              "${REFERENCE_YUZULOGO_15HZ_XP3_SHA256}" \
              "reference/xp3/logo_test_oracle_yuzulogo_15hz.xp3"
            printf '%s  %s\n' \
              "${REFERENCE_M2LOGO_15HZ_XP3_SHA256}" \
              "reference/xp3/logo_test_oracle_m2logo_15hz.xp3"
          } | sha256sum -c -
          unzip -p \
            "reference/packages/Kirikiroid2_1.3.9.apk" \
            "lib/arm64-v8a/libgame.so" \
            > reference/libgame/libgame.so
          printf '%s  %s\n' \
            "${REFERENCE_LIBGAME_SHA256}" \
            "reference/libgame/libgame.so" \
            | sha256sum -c -

      # Redroid needs the Android binder driver. Azure kernels don't
      # ship binder in the default module set — try linux-modules-extra
      # first (which on Canonical Ubuntu images carries binder). If
      # still missing, fail loud with diagnostics so the rest of the
      # job doesn't waste time.
      - name: Set up Android binder
        run: |
          set -x
          uname -a
          cat /boot/config-$(uname -r) 2>/dev/null | grep -iE 'CONFIG_ANDROID|BINDER' || true
          # linux-modules-extra-<ver> on Azure kernels sometimes ships
          # binder + binderfs; cost is ~30s download, worth trying.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            "linux-modules-extra-$(uname -r)" || true
          ls -la /lib/modules/$(uname -r)/kernel/drivers/android/ 2>/dev/null || true
          sudo modprobe binder_linux num_binders=3 || \
            sudo modprobe binder num_binders=3 || true
          lsmod | grep -E '^binder' || \
            { echo "::error::binder kernel module unavailable on $(uname -r) — Redroid cannot run on this GitHub-hosted runner" >&2; exit 1; }
          sudo mkdir -p /dev/binderfs
          mountpoint -q /dev/binderfs || \
            sudo mount -t binder binder /dev/binderfs
          ls /dev/binderfs

      - name: Install adb + tools
        run: |
          sudo apt-get update -qq
          # qemu-user-static lets binfmt_misc transparently run the
          # x86_64-only Android build-tools binaries (aapt2, zipalign) on
          # the arm64 runner — Google doesn't ship aarch64 Linux builds
          # for build-tools yet.
          sudo apt-get install -y --no-install-recommends \
            adb make xz-utils unzip qemu-user-static binfmt-support
          adb version

      - name: Enable amd64 multiarch for x86_64 build-tools runtime
        run: |
          set -eux
          # qemu-user-static emulates x86_64 syscalls, but the target
          # binaries (aapt2, zipalign) are dynamically linked against
          # glibc+libstdc++ and need an x86_64 ld.so + runtime libs on
          # disk. ubuntu-24.04-arm's default sources are ports.ubuntu.com
          # (arm64 only); archive.ubuntu.com carries amd64. Add amd64 as
          # a foreign arch and point a dedicated source at archive.
          #
          # ubuntu.sources on noble-arm64 has multiple deb822 records
          # (noble + noble-security), so pin ALL of them to
          # Architectures: arm64 — a single-record sed would leave
          # noble-security unconstrained and apt would try to fetch
          # amd64 Packages from ports.ubuntu.com → 404.
          echo "--- before ---"
          cat /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's/^Signed-By:/Architectures: arm64\nSigned-By:/g' \
            /etc/apt/sources.list.d/ubuntu.sources
          echo "--- after ---"
          cat /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/amd64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo dpkg --add-architecture amd64
          sudo apt-get update -qq
          # libc6:amd64 ships /lib64/ld-linux-x86-64.so.2 + libm/libdl/
          # libpthread; libstdc++6 + zlib1g cover aapt2's C++ deps.
          sudo apt-get install -y --no-install-recommends \
            libc6:amd64 libstdc++6:amd64 zlib1g:amd64

      - name: Setup JDK for APK repack
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download libharness.so artifact
        uses: actions/download-artifact@v4
        with:
          name: libharness-gnustl-arm64
          path: tests/differential/oracle_runner/harness/prebuilt

      - name: Check libharness.so C++ ABI
        run: |
          file tests/differential/oracle_runner/harness/prebuilt/libharness.so
          python3 tests/differential/oracle_runner/check_harness_abi.py \
            --harness tests/differential/oracle_runner/harness/prebuilt/libharness.so \
            --target-library reference/libgame/libgame.so

      - name: Cache Android SDK build-tools
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-bt${{ env.ANDROID_BUILD_TOOLS_VERSION }}-p${{ env.ANDROID_PLATFORM_VERSION }}

      - name: Install Android SDK build-tools
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" >/dev/null

      - name: Install apktool
        run: |
          set -eux
          sudo curl -fsSL -o /opt/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          sudo tee /usr/local/bin/apktool >/dev/null <<'EOF'
          #!/bin/sh
          exec java -Xmx1g -jar /opt/apktool.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Build harness APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: tests/differential/oracle_runner/harness-apk/build.sh

      - name: Verify harness APK payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for p in (
              Path("tests/differential/oracle_runner/harness-apk/HarnessActivity.java"),
              Path("tests/differential/oracle_runner/harness-apk/prebuilt/krkr2-harness.apk"),
          ):
              print(f"{p}: sha256={hashlib.sha256(p.read_bytes()).hexdigest()}")
          PY
          unzip -p \
            tests/differential/oracle_runner/harness-apk/prebuilt/krkr2-harness.apk \
            classes2.dex > /tmp/harness-classes2.dex
          python3 - <<'PY'
          from pathlib import Path
          dex = Path("/tmp/harness-classes2.dex").read_bytes()
          for needle in (
              b"libharness loaded; starting RPC server",
              b"classLoad",
              b"server thread started from ",
              b"onCreate",
              b"onWindowFocusChanged",
              b"listening on 127.0.0.1:",
          ):
              assert needle in dex, f"classes2.dex missing marker: {needle!r}"
              print(f"classes2.dex marker ok: {needle.decode()}")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Frida host deps
        run: pip install -r tests/differential/oracle_runner/requirements-oracle.txt

      - name: Cache frida-server binary
        uses: actions/cache@v4
        id: frida-server-cache
        with:
          path: tools/bin/android/frida-server
          key: frida-server-${{ env.FRIDA_VERSION }}-android-arm64

      - name: Download frida-server
        if: steps.frida-server-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/bin/android
          curl -L -o /tmp/frida-server.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz"
          xz -d /tmp/frida-server.xz
          mv /tmp/frida-server tools/bin/android/frida-server
          chmod 755 tools/bin/android/frida-server

      - name: Start Redroid container
        run: |
          set -x
          docker pull "${REDROID_IMAGE}"
          # --network=host so `adb connect localhost:5555` from runner
          # talks to redroid's adbd on the same IP namespace.
          # The ad-supported 1.3.9 APK exits during startup under a non-Chinese
          # system locale. Pin the fresh Redroid instance before zygote starts;
          # the check below proves the effective AOSP locale precedence.
          docker run -d --rm --name redroid \
            --privileged \
            --network=host \
            "${REDROID_IMAGE}" \
            androidboot.redroid_fps=15 \
            ro.product.locale=zh-CN \
            ro.product.locale.language=zh \
            ro.product.locale.region=CN
          # Wait for boot: adb connect + sys.boot_completed=1.
          for i in $(seq 1 60); do
            sleep 5
            adb connect localhost:5555 2>&1 | grep -qE 'connected|already' || continue
            bc=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')
            echo "boot_completed=${bc} (attempt ${i}/60)"
            if [ "${bc}" = "1" ]; then
              echo "Redroid ready"
              break
            fi
            if [ "${i}" = "60" ]; then
              echo "::error::Redroid didn't boot within 5 minutes" >&2
              docker logs redroid >&2 || true
              exit 1
            fi
          done
          redroid_fps=$(adb -s localhost:5555 shell getprop ro.boot.redroid_fps 2>/dev/null | tr -d '\r\n')
          if [ "${redroid_fps}" != "15" ]; then
            echo "::error::Redroid FPS contract mismatch: expected 15, got ${redroid_fps:-unset}" >&2
            docker logs redroid >&2 || true
            exit 1
          fi
          echo "Redroid display FPS=${redroid_fps}"
          persist_locale=$(adb -s localhost:5555 shell getprop persist.sys.locale 2>/dev/null | tr -d '\r\n')
          product_locale=$(adb -s localhost:5555 shell getprop ro.product.locale 2>/dev/null | tr -d '\r\n')
          runtime_locale="${persist_locale:-${product_locale}}"
          echo "Redroid locale: persist=${persist_locale:-unset} product=${product_locale:-unset} runtime=${runtime_locale:-unset}"
          if [ "${runtime_locale}" != "zh-CN" ]; then
            echo "::error::Redroid locale contract mismatch: expected zh-CN, got ${runtime_locale:-unset}" >&2
            adb -s localhost:5555 shell am get-config >&2 || true
            docker logs redroid >&2 || true
            exit 1
          fi
          adb -s localhost:5555 shell am get-config
          adb devices -l

      - name: Set up ADB+Frida oracle runtime
        run: |
          set -euo pipefail
          export ANDROID_SERIAL=localhost:5555
          # Frida needs ptrace privileges; our Activity isn't debuggable so
          # without root the attach fails with PermissionDeniedError. Redroid
          # images are userdebug so `adb root` flips adbd into the root shell.
          adb -s "${ANDROID_SERIAL}" root || true
          ready=0
          for i in $(seq 1 30); do
            adb connect "${ANDROID_SERIAL}" >/dev/null 2>&1 || true
            state=$(adb -s "${ANDROID_SERIAL}" get-state 2>/dev/null || true)
            uid=""
            if [ "${state}" = "device" ]; then
              uid=$(adb -s "${ANDROID_SERIAL}" shell id -u 2>/dev/null |
                    tr -d '\r' || true)
            fi
            echo "adb_state=${state:-unavailable} uid=${uid:-unknown} (attempt ${i}/30)"
            if [ "${state}" = "device" ] && [ "${uid}" = "0" ]; then
              ready=1
              break
            fi
            adb disconnect "${ANDROID_SERIAL}" >/dev/null 2>&1 || true
            sleep 2
          done
          if [ "${ready}" != "1" ]; then
            echo "::error::Redroid did not reconnect as root" >&2
            adb devices -l >&2 || true
            docker logs redroid >&2 || true
            exit 1
          fi

          # Install the repacked krkr2-harness.apk; adb_engine.py drives
          # HarnessActivity over a TCP socket (adb forward). This path
          # runs cocos2d's native init before STARTUP_FROM schedules the
          # fixture's normal TVPMainScene startup chain.
          # The 1.3.9 harness manifest is raised to target SDK 23 while
          # repacking. Grant its runtime permissions up front so Android 12
          # cannot interpose ReviewPermissionsActivity on the RPC Activity.
          adb -s "${ANDROID_SERIAL}" install -r -t -g \
                   tests/differential/oracle_runner/harness-apk/prebuilt/krkr2-harness.apk

          # Push frida-server separately (not inside APK).
          adb -s "${ANDROID_SERIAL}" push tools/bin/android/frida-server   /data/local/tmp/
          adb -s "${ANDROID_SERIAL}" shell "chmod 755 /data/local/tmp/frida-server"
          adb -s "${ANDROID_SERIAL}" shell "nohup /data/local/tmp/frida-server -D >/dev/null 2>&1 &"
          sleep 3
          test -n "$(adb -s "${ANDROID_SERIAL}" shell pidof frida-server | tr -d '[:space:]')" \
            || { echo 'frida-server did not start' >&2; exit 1; }

      - name: Record motion_playback oracle for fresh compare
        env:
          ANDROID_SERIAL: localhost:5555
          KRKR2_ADB_RPC_TRANSPORT: shell-nc
          MOTION_PLAYBACK_ORACLE_RECORD_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          log_dir=/tmp/motion_playback_record_logs
          rm -rf "${log_dir}"
          mkdir -p "${log_dir}"

          record_rc=1
          attempts="${MOTION_PLAYBACK_ORACLE_RECORD_ATTEMPTS}"
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::motion_playback oracle record attempt ${attempt}/${attempts}"
            rm -f tests/differential/traces/motion_playback/*.oracle.json
            adb -s "${ANDROID_SERIAL}" shell "am force-stop ${ORACLE_APK_PACKAGE}" || true
            adb -s "${ANDROID_SERIAL}" forward --remove tcp:5039 || true
            adb -s "${ANDROID_SERIAL}" logcat -c || true

            if [ "${attempt}" -gt 1 ]; then
              adb -s "${ANDROID_SERIAL}" shell "pkill -f frida-server || killall frida-server || true" || true
              adb -s "${ANDROID_SERIAL}" shell "nohup /data/local/tmp/frida-server -D >/dev/null 2>&1 &"
              sleep 3
              test -n "$(adb -s "${ANDROID_SERIAL}" shell pidof frida-server | tr -d '[:space:]')" \
                || { echo 'frida-server did not restart' >&2; record_rc=1; echo "::endgroup::"; continue; }
            fi

            set +e
            {
              for case in yuzulogo m2logo; do
                xp3="reference/xp3/logo_test_oracle_${case}_15hz.xp3"
                echo "--- recording ${case} from ${xp3} ---"
                adb -s "${ANDROID_SERIAL}" shell "am force-stop ${ORACLE_APK_PACKAGE}" || true
                adb -s "${ANDROID_SERIAL}" forward --remove tcp:5039 || true
                adb -s "${ANDROID_SERIAL}" logcat -c || true
                python3 tests/differential/python/run_motion_playback.py \
                  --record-oracle --serial "${ANDROID_SERIAL}" \
                  --startup-xp3 "${xp3}" \
                  --case "${case}" \
                  --playback-timeout 300
                case_rc=$?
                if [ "${case_rc}" -ne 0 ]; then
                  exit "${case_rc}"
                fi
              done
            } 2>&1 | tee "${log_dir}/attempt-${attempt}.log"
            record_rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "${record_rc}" -eq 0 ]; then
              echo "motion_playback oracle recording succeeded on attempt ${attempt}/${attempts}"
              break
            fi
            echo "::warning::motion_playback oracle recording attempt ${attempt}/${attempts} failed with exit code ${record_rc}"
            rm -f tests/differential/traces/motion_playback/*.oracle.json
            {
              echo "--- attempt ${attempt} diagnostics ---"
              adb -s "${ANDROID_SERIAL}" shell "pidof ${ORACLE_APK_PACKAGE} || true"
              adb -s "${ANDROID_SERIAL}" forward --list || true
              adb -s "${ANDROID_SERIAL}" shell "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -i ':13AF' || true" || true
              adb -s "${ANDROID_SERIAL}" shell "dumpsys activity activities 2>/dev/null | grep -E -C 3 '${ORACLE_APK_PACKAGE}|mResumed|mFocused' || true" || true
              adb -s "${ANDROID_SERIAL}" logcat -d -v time 2>/dev/null \
                | grep -E "HarnessRpc|AndroidRuntime|${ORACLE_APK_PACKAGE}|krkr2|harness|Cocos2dx|libc|DEBUG" \
                | tail -300 || true
              echo "--- recent raw logcat tail ---"
              adb -s "${ANDROID_SERIAL}" logcat -d -t 120 || true
            } | tee "${log_dir}/attempt-${attempt}-diagnostics.log"
            sleep 5
          done

          if [ "${record_rc}" -ne 0 ]; then
            echo "::error::motion_playback oracle recording failed; stdout diagnostics follow"
            echo "::group::motion_playback oracle failure diagnostics"
            echo "--- run_motion_playback captured stdout/stderr by attempt ---"
            for f in "${log_dir}"/attempt-*.log; do
              [ -f "${f}" ] || continue
              echo "--- ${f} ---"
              cat "${f}" || true
            done
            adb -s "${ANDROID_SERIAL}" shell "pidof ${ORACLE_APK_PACKAGE} || true"
            adb -s "${ANDROID_SERIAL}" forward --list || true
            adb -s "${ANDROID_SERIAL}" shell "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -i ':13AF' || true" || true
            adb -s "${ANDROID_SERIAL}" shell "dumpsys activity activities 2>/dev/null | grep -E -C 3 '${ORACLE_APK_PACKAGE}|mResumed|mFocused' || true" || true
            adb -s "${ANDROID_SERIAL}" logcat -d -v time 2>/dev/null \
              | grep -E "HarnessRpc|AndroidRuntime|${ORACLE_APK_PACKAGE}|krkr2|harness|Cocos2dx|libc|DEBUG" \
              | tail -300 || true
            echo "--- recent raw logcat tail ---"
            adb -s "${ANDROID_SERIAL}" logcat -d -t 120 || true
            echo "::endgroup::"
            exit "${record_rc}"
          fi
          echo "--- recorded oracle traces ---"
          ls -la tests/differential/traces/motion_playback/ || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec_dir = Path("tests/differential/specs/motion_playback")
          trace_dir = Path("tests/differential/traces/motion_playback")
          for spec_path in sorted(spec_dir.glob("*.json")):
              spec = json.loads(spec_path.read_text(encoding="utf-8"))
              path = trace_dir / f"{spec['id']}.oracle.json"
              assert path.exists(), f"{path} missing"
              frames = json.loads(path.read_text(encoding="utf-8"))
              assert frames and frames[0].get("layers"), f"{path} empty"
              print(f"{path}: frames={len(frames)}, layer_count={len(frames[0]['layers'])}")
          PY

      - name: Upload motion_playback oracle record logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion_playback-oracle-record-logs
          path: /tmp/motion_playback_record_logs/*
          if-no-files-found: ignore

      - name: Record motion_playback semantic render-path oracle
        env:
          ANDROID_SERIAL: localhost:5555
          KRKR2_ADB_RPC_TRANSPORT: shell-nc
        run: |
          set -euo pipefail
          rm -rf tests/differential/artifacts/motion_playback_render_stages_oracle
          mkdir -p tests/differential/artifacts/motion_playback_render_stages_oracle
          for case in yuzulogo m2logo; do
            xp3="reference/xp3/logo_test_oracle_${case}_15hz.xp3"
            adb -s "${ANDROID_SERIAL}" shell "am force-stop ${ORACLE_APK_PACKAGE}" || true
            adb -s "${ANDROID_SERIAL}" forward --remove tcp:5039 || true
            adb -s "${ANDROID_SERIAL}" logcat -c || true
            python3 tests/differential/python/run_motion_stage_oracle.py \
              --serial "${ANDROID_SERIAL}" \
              --startup-xp3 "${xp3}" \
              --case "${case}" \
              --stage render_path \
              --render-artifact-dir tests/differential/artifacts/motion_playback_render_stages_oracle \
              --playback-timeout 300
          done
          python3 tests/differential/python/validate_motion_render_artifact.py \
            --artifact-root tests/differential/artifacts/motion_playback_render_stages_oracle

      - name: Upload motion_playback oracle traces
        uses: actions/upload-artifact@v4
        with:
          name: motion_playback-oracle-traces
          path: tests/differential/traces/motion_playback/*.oracle.json
          if-no-files-found: error

      - name: Upload motion_playback oracle render-stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motion_playback-oracle-render-stages
          path: |
            tests/differential/artifacts/motion_playback_render_stages_oracle/manifest.json
            tests/differential/artifacts/motion_playback_render_stages_oracle/events/**
          if-no-files-found: error

      - name: Stop Redroid
        if: always()
        run: docker stop redroid || true

  motion-playback-compare:
    needs: [wasmtime, adb-frida]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download motion_playback Wasmtime traces
        uses: actions/download-artifact@v4
        with:
          name: motion_playback-wasmtime-traces
          path: /tmp/motion_playback/wasmtime

      - name: Download motion_playback oracle traces
        uses: actions/download-artifact@v4
        with:
          name: motion_playback-oracle-traces
          path: /tmp/motion_playback/oracle

      - name: Download motion_playback Wasmtime render-stage artifacts
        uses: actions/download-artifact@v4
        with:
          name: motion_playback-wasmtime-render-stages
          path: /tmp/motion_playback/render/wasmtime

      - name: Download motion_playback oracle render-stage artifacts
        uses: actions/download-artifact@v4
        with:
          name: motion_playback-oracle-render-stages
          path: /tmp/motion_playback/render/oracle

      - name: Compare fresh motion_playback traces and semantic render path
        run: |
          set +e
          python3 tests/differential/python/compare_motion_playback_traces.py \
            --spec-dir tests/differential/specs/motion_playback \
            --port-trace-dir /tmp/motion_playback/wasmtime \
            --oracle-trace-dir /tmp/motion_playback/oracle \
            --markdown-report /tmp/motion_playback/motion_playback_compare.md
          trace_compare_rc=$?

          python3 tests/differential/python/compare_motion_render_steps.py \
            --oracle-root /tmp/motion_playback/render/oracle \
            --wasmtime-root /tmp/motion_playback/render/wasmtime \
            --allow-render-flow-diagnostics \
            --semantic-only \
            2>&1 | tee /tmp/motion_playback/motion_render_semantic_compare.txt
          render_compare_rc=${PIPESTATUS[0]}

          python3 tests/differential/python/compare_motion_draw_dispatch.py \
            --oracle-root /tmp/motion_playback/render/oracle \
            --wasmtime-root /tmp/motion_playback/render/wasmtime \
            2>&1 | tee /tmp/motion_playback/motion_draw_dispatch_compare.txt
          draw_dispatch_compare_rc=${PIPESTATUS[0]}
          set -e

          echo "--- motion_playback markdown report ---"
          cat /tmp/motion_playback/motion_playback_compare.md || true
          echo "--- motion_playback semantic render report ---"
          cat /tmp/motion_playback/motion_render_semantic_compare.txt || true
          echo "--- motion_playback draw-dispatch report ---"
          cat /tmp/motion_playback/motion_draw_dispatch_compare.txt || true
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f /tmp/motion_playback/motion_playback_compare.md ]; then
            cat /tmp/motion_playback/motion_playback_compare.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo ""
              echo "# motion_playback Semantic Render Compare"
              echo ""
              echo '```text'
              cat /tmp/motion_playback/motion_render_semantic_compare.txt || true
              echo '```'
              echo ""
              echo "# motion_playback Draw-Dispatch Compare"
              echo ""
              echo '```text'
              cat /tmp/motion_playback/motion_draw_dispatch_compare.txt || true
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${trace_compare_rc}" -ne 0 ] \
              || [ "${render_compare_rc}" -ne 0 ] \
              || [ "${draw_dispatch_compare_rc}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload motion_playback compare report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion_playback-compare-report
          path: |
            /tmp/motion_playback/motion_playback_compare.md
            /tmp/motion_playback/motion_render_semantic_compare.txt
            /tmp/motion_playback/motion_draw_dispatch_compare.txt
          if-no-files-found: warn
