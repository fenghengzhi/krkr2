name: Build Web

on:
  workflow_dispatch:
    inputs:
      cloudflare_pages_deploy:
        description: Cloudflare Pages deployment (none = don't upload)
        required: false
        type: choice
        default: none
        options:
          - none
          - preview
          - production

  workflow_run:
    workflows: ["Code Format Check"]
    types: ["completed"]
  push:
    branches:
      - web
      - 'dev/*'

env:
  EMSDK_VERSION: "6.0.9"

jobs:
  build-web:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      EMSDK: ${{ github.workspace }}/.emsdk
      BUILD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      KRKR2_WEB_SOURCE_MAP: ${{ (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'dev/')) || (github.event_name != 'workflow_run' && startsWith(github.ref_name, 'dev/')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          lfs: true
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison ninja-build python3 autoconf automake libtool

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK }}
          ${{ env.EMSDK }}/emsdk install ${{ env.EMSDK_VERSION }}
          ${{ env.EMSDK }}/emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          source ${{ env.EMSDK }}/emsdk_env.sh
          echo "EMSDK=${{ env.EMSDK }}" >> $GITHUB_ENV
          echo "EM_CONFIG=${{ env.EMSDK }}/.emscripten" >> $GITHUB_ENV
          echo "EMSDK_NODE=$(find ${{ env.EMSDK }}/node -name node -type f | head -1)" >> $GITHUB_ENV
          echo "${{ env.EMSDK }}" >> $GITHUB_PATH
          echo "${{ env.EMSDK }}/upstream/emscripten" >> $GITHUB_PATH
          echo "$(dirname $(find ${{ env.EMSDK }}/node -name node -type f | head -1))" >> $GITHUB_PATH

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: b1e15efef6758eaa0beb0a8732cfa66f6a68a81d

      - name: Check NuGet API key
        run: |
          if [ -n "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "HAS_NUGET_KEY=true" >> $GITHUB_ENV
          fi

      - name: Install Mono (for NuGet)
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          sudo apt-get install -y mono-complete

      - name: Add NuGet sources
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            sources add \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ github.actor }}" \
            -Password "${{ secrets.NUGET_API_KEY }}"
          mono `${{ env.VCPKG_ROOT }}/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.NUGET_API_KEY }}" \
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}

      - name: Pre-build Emscripten ports
        run: |
          # Explicit variants avoid the 6.0.9 libpng/FreeType ports passing True as a boolean flag.
          embuilder build libpng libpng-mt libpng-legacysjlj libpng-mt-legacysjlj
          embuilder build freetype freetype-legacysjlj
          embuilder build harfbuzz harfbuzz-mt
          embuilder build sdl2 sdl2-mt
          embuilder build sdl2_ttf sdl2_ttf-mt

      - name: Configure CMake
        run: |
          set -o pipefail
          echo "Build branch: $BUILD_BRANCH; source map: $KRKR2_WEB_SOURCE_MAP"
          : > /tmp/cmake-configure.log

          # CMake configures vcpkg as part of this step. Retry transient source
          # download failures while preserving every attempt in the artifact log.
          configure_status=1
          for attempt in 1 2 3; do
            echo "CMake configure attempt $attempt/3" | tee -a /tmp/cmake-configure.log
            if cmake --preset "Web Release Config" \
              -DKRKR2_WEB_ENABLE_SOURCE_MAP="$KRKR2_WEB_SOURCE_MAP" \
              -DKRKR2_BUILD_VERSION="$BUILD_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              2>&1 | tee -a /tmp/cmake-configure.log; then
              configure_status=0
              break
            else
              configure_status=${PIPESTATUS[0]}
            fi

            if [ "$attempt" -lt 3 ]; then
              retry_delay=$((attempt * 15))
              echo "::warning::CMake/vcpkg configuration failed (attempt $attempt/3); retrying in ${retry_delay}s"
              sleep "$retry_delay"
            fi
          done

          exit "$configure_status"

      - name: Build
        run: |
          set -o pipefail
          cmake --build out/web/release 2>&1 | tee /tmp/cmake-build.log
          node tests/web/vlfs_zip_cache.test.mjs
          node tests/web/web_release_asset_pair.test.mjs out/web/release

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: warn
          path: |
            /tmp/cmake-configure.log
            /tmp/cmake-build.log
            out/web/release/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            out/web/release/index.html
            out/web/release/index.js
            out/web/release/index.wasm
            ${{ env.KRKR2_WEB_SOURCE_MAP == 'true' && 'out/web/release/index.wasm.map' || '' }}
            out/web/release/index.worker.js
            out/web/release/vlfs.js
            out/web/release/assets.zip
            out/web/release/manifest.webmanifest
            out/web/release/sw.js
            out/web/release/pwa/
            out/web/release/baidu_verify_codeva-3Z4bQwqyXI.html
            out/web/release/robots.txt
            out/web/release/sitemap.xml

      - name: Check Cloudflare credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "HAS_CLOUDFLARE_TOKEN=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve Cloudflare Pages environment
        id: deploy_env
        run: |
          # 环境解析规则：
          #   - workflow_dispatch：用用户选择的环境（none/preview/production）
          #   - push 到 web 分支：production
          #   - push 到 dev/* 分支：preview
          #   - 其它自动触发（workflow_run 等）：默认 preview
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            value="${{ inputs.cloudflare_pages_deploy }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "web" ]; then
            value="production"
          else
            value="preview"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages deploy environment resolved to: $value (event=${{ github.event_name }}, ref=${{ github.ref_name }})"

      - name: Prepare Cloudflare Pages upload
        if: ${{ success() && steps.deploy_env.outputs.value != 'none' && (github.event_name == 'workflow_dispatch' || env.HAS_CLOUDFLARE_TOKEN == 'true') }}
        run: |
          rm -rf /tmp/cloudflare-pages
          mkdir -p /tmp/cloudflare-pages
          cp out/web/release/index.html /tmp/cloudflare-pages/
          cp out/web/release/index.js /tmp/cloudflare-pages/
          cp out/web/release/index.wasm /tmp/cloudflare-pages/
          if [ "$KRKR2_WEB_SOURCE_MAP" = "true" ]; then
            test -f out/web/release/index.wasm.map
            cp out/web/release/index.wasm.map /tmp/cloudflare-pages/
          fi
          # VirtualLazyFS: index.data(--preload-file) 已移除，
          # UI 资源改为 assets.zip + vlfs.js 懒加载
          cp out/web/release/vlfs.js /tmp/cloudflare-pages/
          cp out/web/release/assets.zip /tmp/cloudflare-pages/
          if [ -f out/web/release/index.worker.js ]; then
            cp out/web/release/index.worker.js /tmp/cloudflare-pages/
          fi
          cp out/web/release/manifest.webmanifest /tmp/cloudflare-pages/
          cp out/web/release/sw.js /tmp/cloudflare-pages/
          cp -R out/web/release/pwa /tmp/cloudflare-pages/
          cp out/web/release/baidu_verify_codeva-3Z4bQwqyXI.html /tmp/cloudflare-pages/
          cp out/web/release/robots.txt /tmp/cloudflare-pages/
          cp out/web/release/sitemap.xml /tmp/cloudflare-pages/
          cp _headers /tmp/cloudflare-pages/

      - name: Upload to Cloudflare Pages
        id: cloudflare_pages
        if: ${{ success() && steps.deploy_env.outputs.value != 'none' && (github.event_name == 'workflow_dispatch' || env.HAS_CLOUDFLARE_TOKEN == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_ENVIRONMENT: ${{ steps.deploy_env.outputs.value }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || secrets.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || 'main' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required to upload to Cloudflare Pages"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is required to upload to Cloudflare Pages"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME variable or secret is required to upload to Cloudflare Pages"
            exit 1
          fi
          deploy_branch="$BUILD_BRANCH"
          if [ "$CLOUDFLARE_PAGES_ENVIRONMENT" = "production" ]; then
            deploy_branch="$CLOUDFLARE_PAGES_PRODUCTION_BRANCH"
          fi
          echo "Uploading $CLOUDFLARE_PAGES_ENVIRONMENT deployment to Cloudflare Pages branch $deploy_branch"
          set -o pipefail
          npx wrangler@latest pages deploy /tmp/cloudflare-pages \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$deploy_branch" 2>&1 | tee /tmp/wrangler-deploy.log

          # 从 wrangler 输出提取部署 URL：
          #   - deploy_url: "Take a peek over at https://<hash>.<project>.pages.dev"（每次部署唯一）
          #   - alias_url:  "Deployment alias URL: https://<branch>.<project>.pages.dev"（分支别名）
          # 注：本 step 跑在 bash -e + pipefail 下；grep 无匹配会返回 1，
          # 故命令替换必须 `|| true`，否则 production(main) 部署无 alias URL 行时
          # 解析失败会让已成功的部署整步报错(exit 1)。URL 为尽力提取,空值已被下方处理。
          deploy_url="$(grep -oiE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | head -n 1 || true)"
          alias_url="$(grep -ioE 'alias URL:[[:space:]]*https://[a-z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log \
            | grep -oiE 'https://[a-z0-9.-]+\.pages\.dev' | head -n 1 || true)"

          # 设为 step output，供后续 step 引用（steps.cloudflare_pages.outputs.*）。
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"

          # 写入 run Summary 页面，让部署地址直接显示在 CI 结果中。
          {
            echo "## Cloudflare Pages 部署"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 环境 | \`$CLOUDFLARE_PAGES_ENVIRONMENT\` |"
            echo "| 分支 | \`$deploy_branch\` |"
            if [ -n "$deploy_url" ]; then
              echo "| 部署 URL | <$deploy_url> |"
            fi
            if [ -n "$alias_url" ]; then
              echo "| 分支别名 URL | <$alias_url> |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$deploy_url" ]; then
            echo "::warning::未能从 wrangler 输出解析到部署 URL（输出格式可能已变化，请检查上方日志）"
          else
            echo "::notice title=Cloudflare Pages::部署地址 $deploy_url"
          fi
